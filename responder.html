<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector | Responder Terminal</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #05070a;
      --sidebar-bg: rgba(13, 17, 23, 0.95);
      --accent-red: #ff3b3b;
      --accent-green: #00f294;
      --accent-blue: #3b82f6;
      --border-thin: rgba(255, 255, 255, 0.08);
      --text-dim: #8b949e;
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-deep);
      color: #ffffff;
      overflow: hidden;
    }

    .dashboard-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
      background: #0b0d10;
    }

    #panel {
      width: 380px;
      min-width: 380px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-thin);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: -20px 0 50px rgba(0,0,0,0.5);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent-blue), #1e3a8a);
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 16px;
    }

    .brand-text h2 { font-size: 16px; margin: 0; text-transform: uppercase; }
    .brand-text span { font-size: 10px; color: var(--accent-blue); font-weight: 700; text-transform: uppercase; }

    #requests {
      flex-grow: 1;
      overflow-y: auto;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 16px;
      display: block;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-thin);
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 12px;
    }

    .card-meta { font-size: 11px; color: var(--accent-red); display:block; margin-bottom:8px; }
    .card-type { font-weight:700; font-size:18px; display:block; margin-bottom:12px; }

    .btn-group { display:flex; gap:10px; }

    button {
      flex:1;
      padding:12px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:600;
      font-size:11px;
    }

    .accept { background: var(--accent-green); color:#000; }
    .deny { background: rgba(255,59,59,0.1); color: var(--accent-red); }

    .status-footer {
      margin-top:24px;
      padding-top:20px;
      border-top:1px solid var(--border-thin);
    }

    .status-tag {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      color:var(--text-dim);
    }

    .dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--accent-green);
    }

    .v-responder {
      background: var(--accent-blue);
      border: 3px solid white;
      border-radius: 50%;
    }

    .v-incident {
      background: var(--accent-red);
      border: 3px solid white;
      border-radius: 50%;
    }
  </style>
</head>

<body>

<div class="dashboard-container">
  <div id="map"></div>

  <aside id="panel">
    <div class="brand-header">
      <div class="logo-mark">R</div>
      <div class="brand-text">
        <h2>Responder Terminal</h2>
        <span>Unit ID: UNT-001</span>
      </div>
    </div>

    <span class="section-label">Active Alerts</span>
    <div id="requests"></div>

    <div class="status-footer">
      <div class="status-tag">
        <div class="dot"></div>
        GPS LINK ACTIVE | <span id="clock">00:00:00</span>
      </div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
},1000);

let map;
let responderId = 1;
let responderMarker;
let incidentMarkers = {};
let routeLines = {};

const BASE = window.location.origin;

// ---------- ICONS ----------
const responderIcon = L.divIcon({
  className:"v-responder",
  iconSize:[16,16],
  iconAnchor:[8,8]
});

const incidentIcon = L.divIcon({
  className:"v-incident",
  iconSize:[16,16],
  iconAnchor:[8,8]
});

// ---------- MAP ----------
async function initMap(){

  let r = null;

  while(!r){
    try{
      let res = await fetch(BASE + "/responders");
      let data = await res.json();
      r = data.find(x => x.id === responderId);
    }catch(e){}

    if(!r){
      await new Promise(done => setTimeout(done,1000));
    }
  }

  map = L.map("map").setView([r.lat,r.lng],13);

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
  ).addTo(map);

  setTimeout(()=>map.invalidateSize(),300);

  responderMarker = L.marker([r.lat,r.lng],{
    icon: responderIcon
  }).addTo(map);
}

// ---------- RESPONDER LIVE ----------
async function syncResponder(){
  try{
    let res = await fetch(BASE + "/responders");
    let data = await res.json();

    let r = data.find(x => x.id === responderId);

    if(r && responderMarker){
      responderMarker.setLatLng([r.lat,r.lng]);
    }

  }catch(e){}
}

// ---------- ROAD ROUTE ----------
async function drawRoadRoute(incident){

  if(!responderMarker) return;

  let start = responderMarker.getLatLng();

  try{
    let resRoute = await fetch(
      `https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${incident.lng},${incident.lat}?overview=full&geometries=geojson`
    );

    let routeData = await resRoute.json();

    if(!routeData.routes || !routeData.routes[0]) return;

    let coords = routeData.routes[0].geometry.coordinates.map(
      c => [c[1], c[0]]
    );

    if(routeLines[incident.id]){
      map.removeLayer(routeLines[incident.id]);
    }

    routeLines[incident.id] = L.polyline(coords,{
      color:"#3b82f6",
      weight:3,
      opacity:0.4
    }).addTo(map);

  }catch(e){}
}

// ---------- INCIDENTS ----------
async function loadIncidents(){

  try{
    let res = await fetch(BASE + "/incidents");
    let data = await res.json();

    let container = document.getElementById("requests");
    container.innerHTML = "";

    // remove old markers
    Object.keys(incidentMarkers).forEach(id=>{
      if(!data.find(x => x.id == id)){
        if(incidentMarkers[id]){
          map.removeLayer(incidentMarkers[id]);
          delete incidentMarkers[id];
        }

        if(routeLines[id]){
          map.removeLayer(routeLines[id]);
          delete routeLines[id];
        }
      }
    });

    for (const i of data){

      // SOS marker
      if(!incidentMarkers[i.id]){
        incidentMarkers[i.id] =
          L.marker([i.lat,i.lng],{
            icon: incidentIcon
          }).addTo(map);
      }

      // if assigned to this responder → road route
      if(i.responder_id === responderId){
        await drawRoadRoute(i);
      }

      let div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <span class="card-meta">INCIDENT ID: #${i.id}</span>
        <span class="card-type">${i.type.toUpperCase()}</span>
        <span class="card-meta">STATUS: ${i.status}</span>

        <div class="btn-group">
          <button class="accept" onclick="acceptIncident(${i.id})">
            ACCEPT
          </button>

          <button class="deny" onclick="denyIncident(${i.id})">
            DENY
          </button>
        </div>
      `;

      container.appendChild(div);
    }

  }catch(e){
    console.log(e);
  }
}

// ---------- ACCEPT ----------
async function acceptIncident(id){

  await fetch(BASE + "/respond",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      incident_id:id,
      responder_id:responderId,
      action:"accept"
    })
  });

  loadIncidents();
}

// ---------- DENY ----------
async function denyIncident(id){

  await fetch(BASE + "/respond",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      incident_id:id,
      responder_id:responderId,
      action:"deny"
    })
  });

  if(incidentMarkers[id]){
    map.removeLayer(incidentMarkers[id]);
    delete incidentMarkers[id];
  }

  if(routeLines[id]){
    map.removeLayer(routeLines[id]);
    delete routeLines[id];
  }

  loadIncidents();
}

// ---------- START ----------
initMap().then(()=>{
  loadIncidents();
  setInterval(loadIncidents,2000);
  setInterval(syncResponder,1000);
});
</script>

</body>
</html>
